name: Diagnose Walmart Fields

on:
  push:
    paths:
      - 'scripts/diagnose_walmart.py'
      - '.github/workflows/diagnose-walmart.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/diagnose_walmart.py
